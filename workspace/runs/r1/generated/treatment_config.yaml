apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: EndpointPickerConfig
featureGates:
  flowControl: true
plugins:
  - type: exponential-ceiling-policy
    name: exponential-ceiling
  - type: random-picker
    name: random-picker
schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: random-picker
flowControl:
  usageLimitPolicyPluginRef: "exponential-ceiling"
